name: Auth end-to-end
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_TEST_DATABASE_URL: postgresql://csavargo:change_me_local_only@127.0.0.1:5432/csavargo_auth_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir csavargo-api install --frozen-lockfile
      - run: pnpm --dir csavargo-web install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose up -d --wait
      - run: docker compose exec -T postgres createdb -U csavargo csavargo_auth_test
      - run: pnpm contract:generate && git -C csavargo-api diff --exit-code -- contracts && git -C csavargo-web diff --exit-code -- src/generated/api.ts
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-browser-results
          path: test-results/
          retention-days: 7
      - run: docker compose down
        if: always()
